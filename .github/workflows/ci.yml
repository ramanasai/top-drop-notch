name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  changelog:
    name: Validate changelog
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the local git-cliff version (docs/development.md)
      GIT_CLIFF_VERSION: "2.14.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Compare against the PR branch head, not the synthetic merge ref,
          # so generated output matches the committed CHANGELOG.md exactly.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Install git-cliff
        run: |
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /tmp
          sudo install "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
      - name: Validate cliff.toml
        run: git-cliff --context > /dev/null
      - name: Check CHANGELOG.md is up to date
        run: |
          git-cliff -o /tmp/CHANGELOG.generated.md
          diff CHANGELOG.md /tmp/CHANGELOG.generated.md
