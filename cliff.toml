# git-cliff configuration — generates CHANGELOG.md from Conventional Commits.
# Usage:  git-cliff -o CHANGELOG.md        (generate)
#         git-cliff --context > /dev/null  (validate config; runs in CI)
# Docs:   https://git-cliff.org/docs/

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

This file is generated by [git-cliff](https://git-cliff.org) — do not edit it by hand.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.scope %} (**{{ commit.scope }}**){% endif %}
{% if commit.breaking %} — **BREAKING CHANGE**{% endif %}
{% endfor %}
{% endfor %}
"""
footer = """
<!--
generated by [git-cliff](https://git-cliff.org)
-->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^revert", group = "Reverts" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Styling" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps", skip = true },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { message = "^ci", group = "CI" },
    # Keep in sync with the scope vocabulary in AGENTS.md:
    # island, activity, tray, clipboard, media, settings, ext, window, ci, docs, release
    { body = ".*", group = "Other" },
]
commit_groups = [
    { title = "Features", key = "Features" },
    { title = "Bug Fixes", key = "Bug Fixes" },
    { title = "Performance", key = "Performance" },
    { title = "Documentation", key = "Documentation" },
    { title = "Refactoring", key = "Refactoring" },
    { title = "Testing", key = "Testing" },
    { title = "CI", key = "CI" },
    { title = "Miscellaneous Tasks", key = "Miscellaneous Tasks" },
    { title = "Reverts", key = "Reverts" },
    { title = "Styling", key = "Styling" },
    { title = "Other", key = "Other" },
]
breaking_patterns = ["BREAKING CHANGE", "breaking change"]
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
